<!DOCTYPE html>
<html lang="en">

<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">

  <script>
    const handleResponse = async (response, parseResponse) => {
      const content = document.querySelector('#content');

      // Set heading based on response status code
      switch (response.status) {
        case 200:
          content.innerHTML = '<h2>Success</h2>';
          break;
        case 201:
          content.innerHTML = '<h2>Created</h2>';
          break;
        case 204:
          content.innerHTML = '<h2>Updated (No Content)</h2>';
          return; // 204 has no body to parse
        case 400:
          content.innerHTML = '<h2>Bad Request</h2>';
          break;
        case 404:
          content.innerHTML = '<h2>Not Found</h2>';
          break;
        default:
          content.innerHTML = '<h2>Error code not implemented by client.</h2>';
          break;
      }

      // Do not parse JSON for HEAD requests
      if (parseResponse) {
        const obj = await response.json();
        console.log(obj);

        if (obj.message) {
          content.innerHTML += `<p>Message: ${obj.message}</p>`;
        }
        if (obj.users) {
          content.innerHTML += `<p>${JSON.stringify(obj.users)}</p>`;
        }
      }
    };

    const requestUpdate = async (userForm) => {
      const url = userForm.querySelector('#urlField').value;
      const method = userForm.querySelector('#methodSelect').value;

      const response = await fetch(url, {
        method: method,
        headers: {
          'Accept': 'application/json',
        },
      });

      // HEAD requests do not return a body to parse
      handleResponse(response, method !== 'head');
    };

    const addUser = async (nameForm) => {
      const action = nameForm.getAttribute('action');
      const method = nameForm.getAttribute('method');

      const nameField = nameForm.querySelector('#nameField');
      const ageField = nameForm.querySelector('#ageField');

      const formData = `name=${encodeURIComponent(nameField.value)}&age=${encodeURIComponent(ageField.value)}`;

      const response = await fetch(action, {
        method: method,
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'Accept': 'application/json',
        },
        body: formData,
      });

      handleResponse(response, response.status !== 204);
    };

    const init = () => {
      const userForm = document.querySelector('#userForm');
      const nameForm = document.querySelector('#nameForm');

      const getUsers = (e) => {
        e.preventDefault();
        requestUpdate(userForm);
        return false;
      };

      const postUser = (e) => {
        e.preventDefault();
        addUser(nameForm);
        return false;
      };

      userForm.addEventListener('submit', getUsers);
      nameForm.addEventListener('submit', postUser);
    };

    window.onload = init;
  </script>
</head>

<body>
  <section id="top">
    <h3>POST Status Code Tests</h3>
    <form id="nameForm" action="/addUser" method="post">
      <label for="name">Name: </label>
      <input id="nameField" type="text" name="name" />
      <label for="age">Age: </label>
      <input id="ageField" type="number" name="age" min="0" max="100" step="1" />
      <input type="submit" value="Add User" />
    </form>
    <form id="userForm" action="/getUsers" method="get">
      <select id='urlField'>
        <option value='/getUsers'>/getUsers</option>
        <option value='/notReal'>/notReal</option>
      </select>
      <select id="methodSelect">
        <option value="get">GET</option>
        <option value="head">HEAD</option>
      </select>
      <input type="submit" value="Get User" />
    </form>
  </section>
  <section id="content">
  </section>
</body>

</html>
